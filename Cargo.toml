[package]
name = "upstash-arriba"
version = "0.3.0"
edition = "2024"
description = "Upstash CLI that stores notes in a Vector index and recalls them by meaning and keyword"
license = "MIT"
repository = "https://github.com/arriba-tools/upstash"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
self_update = { version = "1.3.3", default-features = false, features = ["github", "ureq", "rustls"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[target."cfg(unix)".dependencies]
libc = "0.2.191"
